<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8efd4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0dcc7;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="black" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background transparent -->
  <g filter="url(#shadow)">
    <text x="50%" y="54%" font-family="'Big Shoulders Stencil Display', sans-serif" font-size="380" font-weight="800" fill="url(#grad1)" text-anchor="middle" dominant-baseline="middle" letter-spacing="-20">
      AN
    </text>
  </g>
